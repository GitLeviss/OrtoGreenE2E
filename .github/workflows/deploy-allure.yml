name: 🚀 OrtoGreen E2E CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: 📦 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: 💾 Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ~/.local/share/NuGet/v3-cache
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: 🔧 Restore dependencies
      run: dotnet restore

    - name: 🏗️ Build tests project
      run: dotnet build --configuration Release --no-restore

    - name: 🌐 Install Playwright browsers
      run: |
        echo "🌐 Installing Playwright using the correct .NET method..."

        # Detect and use the playwright.ps1 generated by dotnet build
        if [ -f "./bin/Release/net8.0/playwright.ps1" ]; then
          echo "✅ Found playwright.ps1 — installing browsers + dependencies"
          pwsh ./bin/Release/net8.0/playwright.ps1 install --with-deps
        else
          echo "⚠️ playwright.ps1 not found — installing CLI as fallback"
          dotnet tool install --global Microsoft.Playwright.CLI
          export PATH="$PATH:$HOME/.dotnet/tools"
          playwright install --with-deps
        fi

        echo "🎯 Playwright install completed!"

    - name: 🧹 Clean previous artifacts
      run: |
        echo "🗑️ Cleaning previous artifacts for fresh results..."
        rm -rf allure-results || true
        rm -rf allure-report || true
        rm -rf test-results || true
        rm -rf videos || true
        rm -rf bin/Release/net8.0/allure-results || true
        echo "✅ Cleanup completed!"
      
    - name: 🧪 Run tests with fresh Allure results
      id: tests
      continue-on-error: true

      env:
        ORTOGREEN_EMAIL: ${{ secrets.ORTOGREEN_EMAIL }}
        ORTOGREEN_PASS: ${{ secrets.ORTOGREEN_PASS }}

      run: |
        echo "🚀 Starting fresh test execution..."
        
        # Create directories
        mkdir -p allure-results
        mkdir -p videos
        
        # Set environment variables for headless execution
        export CI=true
        export DOTNET_CLI_TELEMETRY_OPTOUT=1
        

        # Execute tests exactly like your local command
        echo "📋 Running: dotnet test --configuration Release --no-build"
        dotnet test \
          --configuration Release \
          --no-build \
          --logger "console;verbosity=detailed" \
          --logger "trx;LogFileName=test-results.trx" \
          --results-directory ./test-results \
          --collect:"XPlat Code Coverage" || true
        
        # Check and copy Allure results (equivalente ao seu comando local)
        echo "🔍 Checking for Allure results..."
        if [ -d "bin/Release/net8.0/allure-results" ] && [ "$(ls -A bin/Release/net8.0/allure-results)" ]; then
          echo "✅ Allure results found in bin/Release/net8.0/allure-results"
          cp -r bin/Release/net8.0/allure-results/* allure-results/ || true
          echo "📁 Results copied to allure-results/"
        elif [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
          echo "✅ Allure results already in allure-results"
        else
          echo "⚠️ No Allure results found"
          echo "🔍 Searching for Allure directories..."
          find . -name "*allure*" -type d 2>/dev/null || echo "No allure directories found"
          echo "📂 Current directory contents:"
          ls -la
        fi
        
        # Copy videos if they exist
        if [ -d "bin/Release/net8.0/videos" ]; then
          echo "📹 Copying test videos..."
          cp -r bin/Release/net8.0/videos/* videos/ || true
        fi
        
        echo "🎯 Test execution completed!"
        
    - name: 📊 Setup Node.js for Allure
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: 📈 Install Allure Commandline
      run: npm install -g allure-commandline@latest
      
    - name: 📋 Generate Fresh Allure Report
      run: |
        echo "📊 Generating fresh Allure report (equivalente ao seu comando local)..."
        echo "📂 Allure results directory: allure-results"
        echo "📋 Contents:"
        ls -la allure-results/ || echo "Directory empty or not found"
        
        # Generate report with --clean (exatamente como seu comando local)
        if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
          echo "🚀 Running: allure generate allure-results --clean -o allure-report"
          allure generate allure-results --clean -o allure-report
          echo "✅ Fresh Allure report generated successfully!"
          echo "📊 Report directory contents:"
          ls -la allure-report/
        else
          echo "❌ No Allure results found to generate report"
          echo "📄 Creating fallback report..."
          mkdir -p allure-report
          echo '<!DOCTYPE html><html><head><title>OrtoGreen E2E - No Test Results</title><style>body{font-family:Arial,sans-serif;text-align:center;margin-top:50px}.container{max-width:600px;margin:0 auto}.error{color:#e74c3c}.info{color:#3498db}</style></head><body><div class="container"><h1 class="error">🚨 No Test Results Available</h1><p class="info">The tests may have failed to generate Allure results.</p><p>Please check the pipeline logs for more details.</p></div></body></html>' > allure-report/index.html
          echo "📄 Fallback report created"
        fi

    - name: 📤 Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ github.run_number }}
        path: |
          allure-results/
          allure-report/
          videos/
          test-results/
        retention-days: 30
        
    - name: 🚀 Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/main' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        destination_dir: ./
        keep_files: false
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        
    - name: 🎯 Get deployment status
      if: github.ref == 'refs/heads/main'
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Pipeline completed successfully!"
          echo "📊 Allure report deployed to: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        else
          echo "❌ Pipeline completed with errors"
          echo "📊 Check the artifacts for detailed logs"
        fi
